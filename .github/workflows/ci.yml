name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build app
        run: swift build

      - name: Run verification suite
        run: swift run MacPolishVerification

      - name: Verify optimized build
        run: swift run -c release MacPolishVerification

      - name: Verify release failure handling
        run: python3 scripts/test_release_tools.py

      - name: Package and verify universal release
        run: ./scripts/package_release.sh
